[package]
name = "lumisound-media"
version.workspace = true
edition.workspace = true
description = "Lumisound media primitives shared by the bridge and the app core (lock format, audio types)"

[dependencies]
serde = { version = "1", features = ["derive"] }
lofty = "0.22"
opus-decoder = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rustfft = "6"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "alac", "adpcm", "aiff", "caf", "mkv"] }
